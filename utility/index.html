.button {   
   border: 3px solid #000;
   border-radius: 0;
   background: #FF6B6B;
   color: #000;
   box-shadow: 5px 5px 0 0 #000;
   font-size: 30px;
   font-weight: 550;
   padding: 12px 24px;
   margin: 40px 0px 40px 0px;
   cursor: pointer;
   transition: all 0.1s ease;
}


/*.button{
   --esp-tools-button-color: #FF6B6B;
   --esp-tools-button-text-color: black;
   --esp-tools-button-border-radius: 0px;
   font-weight: 550;

}*/

.button:hover {
  transform: translate(-2px, -2px);
  box-shadow: 7px 7px 0 0 #000;
}

.button:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}


.button:focus-visible {
  outline: 3px solid #74B9FF;
  outline-offset: 3px;
}

#myfooter{
   font-size: 30px;
   position: fixed;
   left: 0;
   bottom: 0;
   width: 100%;
   background-color: #FFA552;
   color: #000000;
   text-align: center;
}

a:link, a:visited {
  color: black;
  text-decoration: none;
  cursor: auto;
}


a:hover{
   color:#06d6a0;
   cursor: pointer;
  -webkit-text-stroke: 0.1px #000000;
}
