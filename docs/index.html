   display:flex;

.button {   
   width: 100%;
   border: 3px solid #000;
   border-radius: 0;
   background: #FF6B6B;
   color: #000;
   box-shadow: 5px 5px 0 0 #000;
   font-size: 30px;
   font-weight: 550;
   padding: 12px 24px;
   margin: 20px 0px 0px 0px;
   cursor: pointer;
   transition: all 0.1s ease;
}

.button:hover {
  transform: translate(-2px, -2px);
  box-shadow: 7px 7px 0 0 #000;
}

.button:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}


.button:focus-visible {
  outline: 3px solid #74B9FF;
  outline-offset: 3px;
}

#display {
  height: 80%;
  width: 80%;
  padding: 0.75rem 1rem;
  border: 3px solid #000;
  border-radius: 0;
  background: #fff;
  box-shadow: 3px 3px 0 0 #000;
  transition: box-shadow 0.15s, transform 0.15s;
}

#display:focus {
  outline: 3px solid #74B9FF;
  outline-offset: 2px;
  box-shadow: 5px 5px 0 0 #000;
  transform: translate(-1px, -1px);
}

#myfooter{
   font-size: 30px;
   position: fixed;
   left: 0;
   bottom: 0;
   width: 100%;
   height: 4.5%;
   background-color: #FFA552;
   color: #000000;
   text-align: left;

}

#footerText{
   animation-name: slidingText;
   animation-duration: 25s;
   animation-iteration-count:infinite ;
   animation-timing-function: linear ;

}

a:link, a:visited {
  color: black;
  text-decoration: none;
  cursor: auto;
}


a:hover{
   color:#06d6a0;
   cursor: pointer;
  -webkit-text-stroke: 0.1px #000000;
}

@keyframes slidingText {
  from {transform: translate(-40%);} /* moves the element 50px along the x-axis, and 0px along the y-axis */
  to {transform: translate(100%);}
}

</style>

<body>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

      <!--TRY vw (viewport) to scale!!!!!-->
   <div class="flex_container">
      <a href="https://github.com/telepath9/ESPclock" style="text-indent: -5px ;font-size: 2.8vw; font-style:italic; font-family: Neuropol;line-height: 0.8;  letter-spacing: -2px;  "><b>ESPclock</b></a>
      <p style="font-size: 3.91vw; line-height: 0.8; margin: 10px 0px 40px 0px; user-select: none;">Web Installer</p>
      <div class="wrapper1">

                    <p style="font-size: 1.4vw;">1. Plug your <b>ESP32-C3</b> or <b>ESP8266</b> board</p>
                    <label style="font-size: 1.4vw;" for="display">2. Select Display</label>
                    <select id="display" style="font-size: 20px; width: 100%; margin-bottom: 5%;" >
                    <option value="null">-</option>
                    <option value="tm1637">TM1637</option>
                    <option value="tm1652">TM1652</option>
                    </select>
         <esp-web-install-button manifest=""><button slot="activate" class="button" id="install">INSTALL</button>
           <span slot="unsupported"><h3>Your browser doesn't support the WebSerial API</h3></span>
            <span slot="not-allowed"><h3>Please use https when requesting this website</h3></span>
         </esp-web-install-button>
      </div>   



   </div>

   <footer id="myfooter">

      </p>
   </footer>

   }

   display.addEventListener("change", selectDisplay);
